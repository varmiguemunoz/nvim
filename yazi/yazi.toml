[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
show_hidden = true
show_symlink = true
linemode = "size"
scrolloff = 8

[preview]
wrap = "no"
tab_size = 2
max_width = 1000
max_height = 1000

[opener]
edit = [
  { run = 'nvim %s', block = true, desc = "Neovim", for = "unix" },
]
